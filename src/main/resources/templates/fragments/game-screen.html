<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Waiting Room fragment - rest is empty</title>
    </head>

    <body>
        <div th:fragment="game-screen">
            <div id="piano-roll"></div>
            <div class="my-3">
                <input id="progress" type="range" />
                <div>
                    <button id="loop" type="button" class="btn btn-secondary" title="Loop">
                        <i class="bi bi-arrow-repeat"></i>
                    </button>
                    <button id="play" type="button" class="btn btn-primary" title="Play">
                        <i class="bi bi-play-fill"></i>
                    </button>
                    <button id="pause" type="button" class="btn btn-primary" title="Pause">
                        <i class="bi bi-pause-fill"></i>
                    </button>
                    <button id="stop" type="button" class="btn btn-primary" title="Stop">
                        <i class="bi bi-stop-fill"></i>
                    </button>
                    <button id="clear" type="button" class="btn btn-primary" title="Clear all notes">
                        <i class="bi bi-trash-fill"></i>
                    </button>
                </div>
            </div>
            <div class="mt-3 d-flex gap-2 justify-content-center">
                <button type="button" id="tmpSaveButton" class="btn btn-primary">Enviar</button>
                <button type="button" id="saveSequenceBtn" class="btn btn-success">
                    <i class="bi bi-save"></i> Guardar secuencia
                </button>
                <button type="button" id="loadSequenceBtn" class="btn btn-info">
                    <i class="bi bi-folder-open"></i> Cargar secuencia
                </button>
            </div>

            <!-- Modal para guardar secuencia -->
            <div class="modal fade" id="save-sequence-modal" tabindex="-1" aria-labelledby="save-sequence-modal-label" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="save-sequence-modal-label">Guardar secuencia</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="save-sequence-name" class="form-label">Nombre de la secuencia</label>
                                <input type="text" id="save-sequence-name" class="form-control" placeholder="Mi secuencia" maxlength="100" />
                            </div>
                            <div id="save-sequence-error" class="alert alert-danger d-none"></div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="button" id="save-sequence-confirm" class="btn btn-success">Guardar</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Modal para cargar secuencia -->
            <div class="modal fade" id="load-sequence-modal" tabindex="-1" aria-labelledby="load-sequence-modal-label" aria-hidden="true">
                <div class="modal-dialog modal-lg">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="load-sequence-modal-label">Cargar secuencia guardada</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <div id="load-sequence-login-warning" class="alert alert-warning d-none">
                                Debes iniciar sesión para cargar secuencias guardadas.
                            </div>
                            <div id="load-sequence-instrument-info" class="alert alert-info d-none"></div>
                            <div id="load-sequence-empty" class="text-center text-muted d-none">
                                No tienes secuencias guardadas.
                            </div>
                            <div id="load-sequence-empty-filtered" class="text-center text-muted d-none"></div>
                            <div id="load-sequence-list"></div>
                            <div id="load-sequence-error" class="alert alert-danger d-none"></div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal fade" id="instructions-modal" tabindex="-1" aria-labelledby="instructions-modal-label" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="instructions-modal-label"></h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div id="instructions-modal-body" class="modal-body"></div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Ok</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
