<!DOCTYPE html>
<html class="h-100" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/head :: header}" />
    <title th:text="#{profile.pageTitle}">IW: Perfil</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
</head>

<body class="d-flex flex-column h-100">
    <header th:replace="~{fragments/nav.html :: nav}"></header>

    <main class="flex-shrink-0">
        <div class="container py-4">
            <h1 class="mt-3 mb-4" th:text="#{profile.title}">Mi perfil</h1>

            <div th:if="${profileOk}" class="alert alert-success" th:text="#{profile.update.success}"></div>
            <div th:if="${profileError}" class="alert alert-danger" th:text="#{${profileError}}"></div>

            <div class="row g-4">
                <div class="col-lg-4">
                    <div class="card h-100">
                        <div class="card-body text-center">
                            <img class="iwthumb rounded-circle mb-3"
                                 style="height: 96px; width: 96px; object-fit: cover;"
                                 th:src="@{/user/{id}/pic(id=${user.id})}"
                                 th:alt="#{profile.avatarAlt}">

                            <h5 class="card-title mb-1" th:text="${user.username}">username</h5>
                            <p class="text-muted mb-3" th:text="${(user.firstName ?: '') + ' ' + (user.lastName ?: '')}">Nombre</p>

                            <ul class="list-group list-group-flush text-start">
                                <li class="list-group-item d-flex justify-content-between">
                                    <span th:text="#{profile.label.login}">Login</span>
                                    <strong th:text="${user.username}">user</strong>
                                </li>
                                <li class="list-group-item d-flex justify-content-between">
                                    <span th:text="#{profile.label.roles}">Roles</span>
                                    <strong th:text="${user.roles}">USER</strong>
                                </li>
                                <li class="list-group-item d-flex justify-content-between">
                                    <span th:text="#{profile.label.status}">Estado</span>
                                    <strong th:text="${user.enabled ? #messages.msg('profile.status.enabled') : #messages.msg('profile.status.disabled')}">Activo</strong>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="card mb-4">
                        <div class="card-body">
                            <h2 class="h5 mb-3" th:text="#{profile.edit.title}">Editar perfil</h2>
                            <form th:action="@{/user/{id}(id=${user.id})}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                                <div class="mb-3">
                                    <label for="username" class="form-label" th:text="#{profile.label.username}">Usuario</label>
                                    <input type="text" id="username" name="username" class="form-control" required
                                           th:value="${user.username}">
                                </div>

                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label for="firstName" class="form-label" th:text="#{profile.label.firstName}">Nombre</label>
                                        <input type="text" id="firstName" name="firstName" class="form-control"
                                               th:value="${user.firstName}">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="lastName" class="form-label" th:text="#{profile.label.lastName}">Apellidos</label>
                                        <input type="text" id="lastName" name="lastName" class="form-control"
                                               th:value="${user.lastName}">
                                    </div>
                                </div>

                                <hr>

                                <p class="text-muted mb-3" th:text="#{profile.password.help}">Deja estos campos vacios si no quieres cambiar la contraseña.</p>

                                <div class="mb-3">
                                    <label for="password" class="form-label" th:text="#{profile.label.password}">Nueva contraseña</label>
                                    <input type="password" id="password" name="password" class="form-control"
                                           autocomplete="new-password">
                                </div>

                                <div class="mb-3">
                                    <label for="pass2" class="form-label" th:text="#{profile.label.repeatPassword}">Repetir contraseña</label>
                                    <input type="password" id="pass2" name="pass2" class="form-control"
                                           autocomplete="new-password">
                                </div>

                                <button type="submit" class="btn btn-primary" th:text="#{profile.save}">Guardar cambios</button>
                            </form>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-body">
                            <h2 class="h5 mb-3" th:text="#{profile.avatar.title}">Foto de perfil</h2>
                            <form th:action="@{/user/{id}/pic(id=${user.id})}" method="post" enctype="multipart/form-data" class="d-flex gap-2 flex-wrap">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <input type="file" name="photo" class="form-control" accept="image/jpeg,image/png" required>
                                <button type="submit" class="btn btn-outline-primary" th:text="#{profile.avatar.upload}">Subir foto</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Ultimas partidas -->
            <div class="row mt-4" th:if="${not #lists.isEmpty(gameHistory)}">
                <div class="col-12">
                    <div class="card">
                        <div class="card-body">
                            <h2 class="h5 mb-3" th:text="#{profile.history.title}">Últimas partidas</h2>
                            <div class="row g-3">
                                <div class="col-12" th:each="game : ${gameHistory}">
                                    <div class="card border-secondary" th:data-game-history-id="${game.id}">
                                        <div class="card-header d-flex justify-content-between align-items-center">
                                            <strong th:text="${game.typeName}">Tipo</strong>
                                            <span class="text-muted small" th:if="${game.dateEnded != null}" th:text="${#temporals.format(game.dateEnded, 'dd/MM/yyyy HH:mm')}">fecha</span>
                                            <span class="text-muted small" th:if="${game.dateEnded == null}" th:text="#{profile.history.dateUnknown}">fecha desconocida</span>
                                        </div>
                                        <div class="card-body">
                                            <p class="mb-2">
                                                <span th:text="#{profile.history.players}">Jugadores:</span>
                                                <span th:text="${#strings.listJoin(game.players, ', ')}">players</span>
                                            </p>
                                            <div class="history-cards-container"></div>
                                        </div>
                                        <div class="visually-hidden" th:id="'sequences-' + ${game.id}" th:text="${game.sequencesJson}">sequences</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <th:block th:replace="~{fragments/footer.html :: footer}" />
    <script th:src="@{/js/components/piano-roll.js}" src="/js/components/piano-roll.js" defer></script>
    <script th:src="@{/js/abcjs-basic-min.js}" src="/js/abcjs-basic-min.js" defer></script>
    <script th:src="@{/js/components/profile.js}" src="/js/components/profile.js" defer></script>
</body>

</html>
