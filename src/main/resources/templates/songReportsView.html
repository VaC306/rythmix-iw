<!DOCTYPE html>
<html class="h-100" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <th:block th:replace="~{fragments/head :: header}" />
    <title th:text="#{contact.pageTitle}"></title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
  </head>

  <body class="d-flex flex-column h-100">
    <header th:replace="~{fragments/nav.html :: nav}"></header>

    <main class="flex-shrink-0">
      
      <div class="container my-5">
        <h1 class="mb-3" th:text="#{songReport.title}"></h1>

        <div th:if="${songReports.empty}" class="alert alert-info" th:text="#{songReport.noReports}"></div>

        <table th:unless="${songReports.empty}" class="table table-striped align-middle">
          <thead>
            <tr>
              <th>ID</th>
              <th>Canción</th>
              <th>Usuario</th>
              <th>Descripción</th>
              <th>Fecha del Reporte</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="report: ${songReports}">
              <td th:text="${report.id}"></td>
              <td th:text="${report.song.title}"></td>
              <td th:text="${report.user.username}"></td>
              <td th:text="${report.contentReport}"></td>
              <td th:text="${#temporals.format(report.dateRegistered, 'dd/MM/yyyy HH:mm')}"></td>
            </tr>
          </tbody>
        </table>
      </div>

    </main>

    <th:block th:replace="~{fragments/footer.html :: footer}" />

  </body>
</html>
