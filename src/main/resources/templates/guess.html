<!DOCTYPE html>
<html class="h-100" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <th:block th:replace="~{fragments/head :: header}" />
    <title th:text="#{guess.pageTitle}"></title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
  </head>

  <body class="d-flex flex-column h-100">
    <header th:replace="~{fragments/nav.html :: nav}"></header>

    <main class="flex-shrink-0">
      <div class="container my-5">
        <h1 class="text-center mb-4" th:text="#{guess.title}"></h1>

        <!-- Feedback -->
        <div
          th:if="${msg}"
          class="alert alert-info text-center d-flex justify-content-center align-items-center gap-2"
        >
          <i class="bi bi-info-circle-fill"></i>
          <span th:text="${#messages.msgOrNull(msg) ?: msg}"></span>
        </div>

        <div th:if="${noAudioAvailable}"
             class="alert alert-danger text-center d-flex justify-content-center align-items-center gap-2">
          <i class="bi bi-exclamation-triangle-fill"></i>
          <span th:text="#{guess.noAudioAdmin}"></span>
        </div>

        <!-- Si no hay sesión -->
        <div th:if="${loginWarning}"
             class="alert alert-warning text-center d-flex justify-content-center align-items-center gap-2">
          <i class="bi bi-person-x-fill"></i>
          <span th:text="#{guess.loginWarning}">Inicia sesión para jugar al daily.</span>
        </div>

        <!-- Info canción (sin revelar título) -->
        <div th:if="${dailyAvailable}" class="card mb-4 shadow-sm">
          <div class="card-body">
            <h2 class="card-title fs-3" th:text="#{guess.info}"></h2>

            <p class="card-text text-center">
              <span th:text="#{guess.year}"></span>:
              <strong th:text="${song.releaseYear}"></strong>
              <span th:text="#{guess.dotSeparator}"></span>
              <span th:text="#{guess.genre}"></span>:
              <strong th:text="${song.genre}"></strong>
            </p>

            <p class="text-muted text-center mb-0">
              <span th:text="#{guess.layers}"></span>:
              <strong th:text="${layerIndex + 1}"></strong>/<strong th:text="${maxLayer + 1}"></strong>
              <span th:text="#{guess.dotSeparator}"></span>
              <span th:text="#{guess.tries}"></span>:
              <strong th:text="${tries}"></strong>/<strong th:text="${maxTries}"></strong>
            </p>
          </div>
        </div>

        <!-- Player -->
        <div th:if="${dailyAvailable}" class="card mb-4 shadow-sm">
          <div class="card-body">
            <div class="text-center mb-3">
              <h2 class="mb-2 fs-5" th:text="#{guess.currentLayer}"></h2>

              <span class="badge badge-theme fs-6 d-inline-flex align-items-center gap-2">
                <!-- Icono según capa (idx) -->
                <th:block th:switch="${layerIndex}">
                  <i th:case="0" class="bi bi-disc"></i>
                  <i th:case="1" class="bi bi-speaker"></i>
                  <i th:case="2" class="bi bi-sliders"></i>
                  <i th:case="*" class="bi bi-mic-fill"></i>
                </th:block>

                <!-- Antes era currentLayer.name; ahora es enum label -->
                <span th:text="${currentLayer.label}"></span>
              </span>
            </div>

            <audio id="player" preload="metadata" th:src="@{${currentLayer.audioUrl}}"></audio>
            <div id="audioError" class="alert alert-warning mt-3 d-none" role="alert">
              <span th:text="#{guess.audioMissing}">No hay audio disponible para esta capa todavia.</span>
            </div>

            <!-- Barra progreso -->
            <div class="px-2">
              <input
                id="seek"
                type="range"
                class="form-range"
                min="0"
                max="100"
                value="0"
                step="0.1"
                th:disabled="${noAudioAvailable}"
              />
              <div class="d-flex justify-content-between text-muted small">
                <span id="tCurrent">0:00</span>
                <span id="tTotal">0:00</span>
              </div>
            </div>

            <!-- Controles -->
            <div class="d-flex justify-content-center align-items-center gap-3 mt-3 flex-wrap">
              <button
                id="btnPlay"
                type="button"
                class="btn btn-primary px-5 d-inline-flex align-items-center gap-2"
                th:disabled="${finished or !logged or noAudioAvailable}"
              >
                <i id="playIcon" class="bi bi-play-fill"></i>
                <span id="playText" th:text="#{guess.play}"></span>
              </button>

              <form th:action="@{/guess/nav}" method="post" class="m-0">
                <input type="hidden" name="dir" value="next" />
                <button
                  type="submit"
                  class="btn btn-outline-info px-4 d-inline-flex align-items-center gap-2"
                  th:disabled="${layerIndex == maxLayer or finished or !logged or noAudioAvailable}"
                >
                  <span th:text="#{guess.next}"></span>
                  <i class="bi bi-skip-forward-fill"></i>
                </button>
              </form>
            </div>

            <span class="d-inline-flex align-items-center gap-2">
              <i class="bi bi-lightning-charge-fill"></i>
              <span th:text="#{guess.tip}"></span>
            </span>

            <div class="text-center mt-3">
              <button type="button" class="btn btn-sm btn-warning" data-bs-toggle="modal" data-bs-target="#reportModal"><i class="bi bi-flag"> </i> <strong>Reportar problema </strong></button>              
            </div>
          </div>
        </div>

        <!-- Adivinar -->
        <div th:if="${dailyAvailable}" class="card shadow-sm">
          <div class="card-body">
            <h2 class="card-title mb-3 fs-3" th:text="#{guess.title}"></h2>

            <form
              th:action="@{/guess/submit}"
              method="post"
              class="row g-2 justify-content-center"
            >
              <div class="col-12 col-md-6">
                <select class="form-select" name="answer" required th:disabled="${finished or !logged or noAudioAvailable}">
                  <option value="" disabled selected th:text="#{guess.selectPlaceholder}"></option>
                  <option
                    th:each="s : ${songList}"
                    th:value="${s.id}"
                    th:text="${s.title + ' – ' + s.artist}"
                  ></option>
                </select>
              </div>

              <div class="col-12 col-md-auto">
                <button
                  class="btn btn-success"
                  type="submit"
                  th:text="#{guess.submit}"
                  th:disabled="${finished or !logged or noAudioAvailable}"
                ></button>
              </div>
            </form>

            <div th:if="${finished}" class="alert alert-secondary text-center mt-3 mb-0">
              <span th:if="${success}">✅ Daily completado.</span>
              <span th:unless="${success}">⏳ Daily terminado por intentos.</span>
            </div>
          </div>
        </div>
      </div>

      <div th:if="${dailyAvailable}" class="modal fade" id="reportModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-md">
          <div class="modal-content">
            <div class="modal-header">
              <h3 class="modal-title d-flex align-items-center gap-2">
                <i class="bi bi-flag-fill text-warning"> </i>
                  <span th:text="#{guess.report.title}">Introduzca el problema encontrado en la canción</span>
              </h3>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>  
            </div>
            <form th:action="@{/guess/reportSong}" method="post">
              <input type="hidden" id="reportCSRF" />
              <input type="hidden" th:name="songId" th:value="${song.id}" />
                <div class="modal-body">
                  <textarea class="form-control" name="details" rows="5" maxlength="500" th:placeholder="#{guess.report.placeholder}">
                  </textarea>
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal" th:text="#{guess.report.cancel}">Cancelar</button>
                  <button type="submit" class="btn btn-warning btn-sm"><i class="bi bi-flag"></i> <span th:text="#{guess.report.submit}">Enviar</span></button>
                </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <th:block th:replace="~{fragments/footer.html :: footer}" />

    <script>
      (() => {
        const audio = document.getElementById("player");
        const btnPlay = document.getElementById("btnPlay");
        const seek = document.getElementById("seek");
        const tCurrent = document.getElementById("tCurrent");
        const tTotal = document.getElementById("tTotal");

        const playIcon = document.getElementById("playIcon");
        const playText = document.getElementById("playText");
        const audioError = document.getElementById("audioError");
        const playLabel = "[[#{guess.play}]]";
        const pauseLabel = "[[#{guess.pause}]]";

        if (!audio || !seek || !tCurrent || !tTotal || !playIcon || !playText) {
          return;
        }

        const fmt = (sec) => {
          if (!isFinite(sec) || sec < 0) return "0:00";
          const m = Math.floor(sec / 60);
          const s = Math.floor(sec % 60);
          return `${m}:${String(s).padStart(2, "0")}`;
        };

        const setPlayLabel = (playing) => {
          if (playing) {
            playIcon.className = "bi bi-pause-fill";
            playText.textContent = pauseLabel;
          } else {
            playIcon.className = "bi bi-play-fill";
            playText.textContent = playLabel;
          }
        };

        audio.addEventListener("loadedmetadata", () => {
          audioError?.classList.add("d-none");
          tTotal.textContent = fmt(audio.duration);
          seek.value = 0;
          tCurrent.textContent = "0:00";
          setPlayLabel(false);
        });

        audio.addEventListener("error", () => {
          console.error("Audio error:", audio.error);
          audioError?.classList.remove("d-none");
          setPlayLabel(false);
        });

        btnPlay?.addEventListener("click", async () => {
          try {
            if (audio.paused) {
              await audio.play();
              setPlayLabel(true);
            } else {
              audio.pause();
              setPlayLabel(false);
            }
          } catch (e) {
            console.error("No se pudo reproducir:", e);
          }
        });

        audio.addEventListener("timeupdate", () => {
          if (!isFinite(audio.duration) || audio.duration <= 0) return;
          const pct = (audio.currentTime / audio.duration) * 100;
          seek.value = String(pct);
          tCurrent.textContent = fmt(audio.currentTime);
        });

        audio.addEventListener("ended", () => {
          setPlayLabel(false);
          seek.value = 0;
          tCurrent.textContent = "0:00";
        });

        seek.addEventListener("input", () => {
          if (!isFinite(audio.duration) || audio.duration <= 0) return;
          const pct = Number(seek.value) / 100;
          audio.currentTime = (pct * audio.duration);
        });
      })();
      
      const reportModal = document.getElementById('reportModal');
      if (reportModal) {
        reportModal.addEventListener('show.bs.Modal', () => {
          const input = document.getElementById('reportCSRF');
          input.name = config.csrf.name;
          input.value = config.csrf.value;
        });
      }

    </script>
  </body>
</html>
